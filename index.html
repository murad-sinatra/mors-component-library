<!doctype html>
<html lang="en" data-mors-palette="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="mors-component-library — an independent, Apple-inspired React component library with portable, exportable CSS."
    />
    <meta name="color-scheme" content="light dark" />
    <title>mors-component-library — React components &amp; design system</title>
    <script>
      try {
        var palette = localStorage.getItem('mors-demo-palette');
        if (
          palette === 'default' ||
          palette === 'farm' ||
          palette === 'cyberpunk' ||
          palette === 'retro' ||
          palette === 'modern'
        ) {
          document.documentElement.setAttribute('data-mors-palette', palette);
        }
        var theme = localStorage.getItem('mors-demo-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-mors-theme', theme);
        }
      } catch (error) {
        /* private mode / blocked storage */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo/main.tsx"></script>
  </body>
</html>
